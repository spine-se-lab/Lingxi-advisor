<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="856" viewBox="0 0 1000 856" role="img" aria-label="Django #21518, root-cause aspect: four concrete root-cause lines from Step 1 each abstracted into a general root-cause analysis step in Step 2."><rect width="1000" height="856" fill="#FBF8F2"/><text x="40" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.6" font-weight="600" fill="#C2452A" text-anchor="start">KNOWLEDGE CONSTRUCTION · ONE ASPECT EXPANDED: ROOT CAUSE</text><text x="40" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#1E2622">Reverse-reason from a past fix, then make it <tspan fill="#2D7656">transferable</tspan>.</text><rect x="40" y="112" width="450" height="86" fill="#FFFFFF" stroke="#E3DCCF"/><text x="60" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" font-weight="600" fill="#6A706B" text-anchor="start">PAST ISSUE · DJANGO #21518</text><text x="60" y="163" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1E2622">Tests that switch <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#C2452A">ROOT_URLCONF</tspan> with <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#C2452A">override_settings</tspan></text><text x="60" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1E2622">break the tests that run after them.</text><rect x="510" y="112" width="450" height="86" fill="#FFFFFF" stroke="#E3DCCF"/><text x="530" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" font-weight="600" fill="#6A706B" text-anchor="start">ITS PATCH</text><text x="530" y="163" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1E2622">Clear the URL caches whenever <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#C2452A">ROOT_URLCONF</tspan> changes,</text><text x="530" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1E2622">via a <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#C2452A">setting_changed</tspan> receiver.</text><rect x="40" y="219" width="82" height="24" rx="3" fill="#FBEAE4" stroke="#C2452A" stroke-width="1"/><text x="81" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#C2452A" text-anchor="middle">root cause</text><text x="134" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#6A706B">is the one aspect expanded below. Each step yields <tspan font-weight="600" fill="#1E2622">Understanding</tspan> and <tspan font-weight="600" fill="#1E2622">Fixing</tspan> knowledge across several aspects.</text><rect x="40" y="268" width="400" height="4" fill="#C2452A"/><rect x="560" y="268" width="400" height="4" fill="#2D7656"/><text x="40" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.6" font-weight="600" fill="#C2452A" text-anchor="start">STEP 1 · REVERSE REASONING</text><text x="560" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.6" font-weight="600" fill="#2D7656" text-anchor="start">STEP 2 · ABSTRACTION</text><text x="40" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1E2622">Why #21518 happened</text><text x="560" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1E2622">How to look for it next time</text><text x="40" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#6A706B">Concrete root cause of this issue</text><text x="560" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#6A706B">General root-cause analysis steps, no Django names</text><rect x="40" y="372" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="40" y="372" width="44" height="70" fill="#FBEAE4"/><text x="62" y="414.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#C2452A" text-anchor="middle">1</text><text x="100" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">override_settings</tspan> changes <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">ROOT_URLCONF</tspan></text><text x="100" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">and sends <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">setting_changed</tspan>.</text><rect x="560" y="372" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="560" y="372" width="44" height="70" fill="#E5F2EA"/><text x="582" y="414.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2D7656" text-anchor="middle">1</text><text x="620" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">Trace a <tspan font-weight="600" fill="#2D7656">configuration change</tspan></text><text x="620" y="423" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">to the code that observes it.</text><path d="M448 407.0 H548" stroke="#6A706B" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M546 402.0 L554 407.0 L546 412.0" fill="none" stroke="#6A706B" stroke-width="1.6"/><rect x="40" y="452" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="40" y="452" width="44" height="70" fill="#FBEAE4"/><text x="62" y="494.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#C2452A" text-anchor="middle">2</text><text x="100" y="481" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">get_resolver()</tspan> keeps the resolver it cached</text><text x="100" y="503" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">for the old URLconf.</text><rect x="560" y="452" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="560" y="452" width="44" height="70" fill="#E5F2EA"/><text x="582" y="494.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2D7656" text-anchor="middle">2</text><text x="620" y="481" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">Find the <tspan font-weight="600" fill="#2D7656">caches built from</tspan></text><text x="620" y="503" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-weight="600" fill="#2D7656">that configuration.</tspan></text><path d="M448 487.0 H548" stroke="#6A706B" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M546 482.0 L554 487.0 L546 492.0" fill="none" stroke="#6A706B" stroke-width="1.6"/><rect x="40" y="532" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="40" y="532" width="44" height="70" fill="#FBEAE4"/><text x="62" y="574.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#C2452A" text-anchor="middle">3</text><text x="100" y="561" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">No <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">setting_changed</tspan> receiver calls</text><text x="100" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">clear_url_caches()</tspan>.</text><rect x="560" y="532" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="560" y="532" width="44" height="70" fill="#E5F2EA"/><text x="582" y="574.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2D7656" text-anchor="middle">3</text><text x="620" y="561" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">Check that the change <tspan font-weight="600" fill="#2D7656">triggers</tspan></text><text x="620" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-weight="600" fill="#2D7656">their invalidation</tspan>.</text><path d="M448 567.0 H548" stroke="#6A706B" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M546 562.0 L554 567.0 L546 572.0" fill="none" stroke="#6A706B" stroke-width="1.6"/><rect x="40" y="612" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="40" y="612" width="44" height="70" fill="#FBEAE4"/><text x="62" y="654.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#C2452A" text-anchor="middle">4</text><text x="100" y="641" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">The next test's <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">reverse()</tspan> resolves</text><text x="100" y="663" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">against stale URL patterns.</text><rect x="560" y="612" width="400" height="70" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="560" y="612" width="44" height="70" fill="#E5F2EA"/><text x="582" y="654.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#2D7656" text-anchor="middle">4</text><text x="620" y="641" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">Check whether <tspan font-weight="600" fill="#2D7656">cached state leaks</tspan></text><text x="620" y="663" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-weight="600" fill="#2D7656">between tests</tspan>.</text><path d="M448 647.0 H548" stroke="#6A706B" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M546 642.0 L554 647.0 L546 652.0" fill="none" stroke="#6A706B" stroke-width="1.6"/><rect x="466.0" y="342" width="68" height="20" fill="#FBF8F2"/><text x="500.0" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#6A706B" text-anchor="middle">ABSTRACT</text><rect x="40" y="708" width="920" height="112" fill="#FFFFFF" stroke="#E3DCCF"/><rect x="40" y="708" width="4" height="112" fill="#2D7656"/><text x="64" y="736" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" font-weight="600" fill="#2D7656" text-anchor="start">A LATER TASK IN THE SAME REPOSITORY · SWE-BENCH DJANGO-11333</text><text x="64" y="764" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622"><tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">get_resolver()</tspan> could build the expensive URL resolver twice: cached once under <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">None</tspan>,</text><text x="64" y="787" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">once under <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">ROOT_URLCONF</tspan>. Steps <tspan font-weight="600">2</tspan> and <tspan font-weight="600">3</tspan> point to the cache key and to what clears the cache;</text><text x="64" y="810" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#1E2622">its fix changed both <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">get_resolver()</tspan> and <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#C2452A">clear_url_caches()</tspan>.</text></svg>